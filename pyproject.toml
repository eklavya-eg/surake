[project]
name = "surake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.15"
dependencies = [
    "browser-use>=0.13.11",
    "fastapi>=0.146.0",
    "langchain-openai>=1.3.4",
    "langchain-openrouter>=0.2.9",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
surake = "surake:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
